name: Daily Public Store Prices

concurrency:
  group: campmate-main-write
  cancel-in-progress: false

on:
  schedule:
    # 매일 오전 7시 한국시간 = UTC 22:00 전날
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: '이번 실행에서 확인할 상품 수'
        required: false
        default: '80'
      store:
        description: '특정 판매처만 확인하려면 이름 입력 (Snowys/BCF/Tentworld/Wild Earth/Anaconda)'
        required: false
        default: ''

jobs:
  public-store-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install browser parsing dependencies
        run: pip install selenium beautifulsoup4

      - name: Scrape public store prices
        run: |
          python scripts/scrape_live_prices.py \
            --limit "${{ github.event.inputs.limit || '80' }}" \
            ${{ github.event.inputs.store && format('--store "{0}"', github.event.inputs.store) || '' }}

      - name: Rebuild product data
        run: python scripts/run_catalog_cleanup.py

      - name: Check for changes
        id: check
        run: |
          git diff --quiet \
            data/products_source.json \
            data/products.json \
            data/live_price_last_run.json \
            data/live_price_scan_state.json \
            || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit updated public store prices
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "CampMate Bot"
          git config user.email "bot@campmate.au"
          git add \
            data/products_source.json \
            data/products.json \
            data/live_price_last_run.json \
            data/live_price_scan_state.json
          if git diff --cached --quiet; then
            echo "No public store price changes"
            exit 0
          fi
          git commit -m "Update public retailer prices $(date +%Y-%m-%d)"
          BRANCH="${GITHUB_REF_NAME:-main}"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"

      - name: Generate static pages
        run: |
          python scripts/generate_static_catalog_pages.py
          python scripts/generate_static_products.py
          python scripts/rebuild_sitemaps.py
          python scripts/embed_static_text_routes.py

      - name: Commit regenerated pages
        run: |
          git config user.name "CampMate Bot"
          git config user.email "bot@campmate.au"
          git add \
            products/ tents.html chairs.html coolers.html stoves.html lanterns.html \
            sleeping-bags.html categories.html popular.html sitemap.xml sitemap-main.xml \
            sitemap-guides.xml sitemap-products.xml worker.js
          if git diff --cached --quiet; then
            echo "No static page changes"
            exit 0
          fi
          git commit -m "Rebuild pages with public retailer prices $(date +%Y-%m-%d)"
          BRANCH="${GITHUB_REF_NAME:-main}"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"

      - name: Log summary
        if: always()
        run: cat data/live_price_last_run.json 2>/dev/null || true
