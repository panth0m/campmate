name: Daily eBay Import

concurrency:
  group: campmate-main-write
  cancel-in-progress: false

on:
  schedule:
    # 매일 오전 6시 (한국시간 KST) = UTC 21:00 (전날)
    - cron: '0 21 * * *'
  workflow_dispatch:  # GitHub에서 수동 실행 버튼
    inputs:
      total:
        description: '가져올 신규 상품 수 (기본 120)'
        required: false
        default: '120'
      image_limit:
        description: '이미지 싱크할 상품 수 (기본 60)'
        required: false
        default: '60'

jobs:
  ebay-import:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 1단계: eBay 상품 수집 ──────────────────────────
      # catalog_rules.py 가 스티커/부품/잘못된 상품 자동 필터링
      # clean_title 이 상품명 자동 정리
      - name: Run eBay weighted round import
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: |
          cd scripts
          python run_ebay_weighted_round.py             --total ${{ github.event.inputs.total || '120' }}             --page-size 100

      # ── 2단계: 이미지 싱크 ────────────────────────────
      # SVG(기본 이미지)만 있는 상품에 eBay 실제 사진 매칭
      # score_item 이 상품명과 가장 일치하는 이미지만 선택
      # BANNED 목록으로 스티커/부품 이미지 자동 제외
      - name: Sync product images from eBay
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
        run: |
          python scripts/sync_product_images_ebay.py             --limit ${{ github.event.inputs.image_limit || '60' }}

      # ── 2.5단계: 실시간 매장 가격 매칭 (현재 Snowys만 구현) ──
      # 상품 카테고리 접미사·인원수/사이즈 숫자까지 일치해야 매칭 확정(오매칭 방지),
      # 확실하지 않으면 그냥 검색 링크로 남겨둠 - 매칭률보다 정확도 우선
      - name: Scrape live store prices
        run: |
          python scripts/scrape_live_prices.py --limit 80

      # ── 3단계: products.json 재생성 ───────────────────
      - name: Clean source catalog and rebuild products.json
        run: |
          python scripts/run_catalog_cleanup.py

      # ── 4단계: 변경사항 감지 후 push ─────────────────
      - name: Check for changes
        id: check
        run: |
          git diff --quiet             data/products_source.json             data/products.json             data/ebay_incremental_state.json             data/ebay_weighted_round_last_run.json             data/image_sync_last_run.json             data/live_price_last_run.json             data/live_price_scan_state.json             && echo "changed=false" >> $GITHUB_OUTPUT             || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated products
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "CampMate Bot"
          git config user.email "bot@campmate.au"
          git add             data/products_source.json             data/products.json             data/ebay_incremental_state.json             data/ebay_weighted_round_last_run.json             data/image_sync_last_run.json             data/live_price_last_run.json             data/live_price_scan_state.json

          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi

          git commit -m "Daily eBay import + image sync $(date +%Y-%m-%d)"
          BRANCH="${GITHUB_REF_NAME:-main}"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"

      # ── 5단계: 실행 결과 로그 ─────────────────────────
      - name: Log import summary
        if: always()
        run: |
          echo "=== eBay Import Summary ==="
          cat data/ebay_weighted_round_last_run.json 2>/dev/null || echo "No summary"
          echo ""
          echo "=== Image Sync Summary ==="
          cat data/image_sync_last_run.json 2>/dev/null || echo "No summary"
          echo ""
          echo "=== Product count by category ==="
          python3 -c "
          import json
          d = json.load(open('data/products.json'))
          cats = {}
          for p in d:
              cats[p['category']] = cats.get(p['category'], 0) + 1
          print(f'Total: {len(d)}')
          for k,v in sorted(cats.items()):
              print(f'  {k}: {v}')
          img = sum(1 for p in d if str(p.get('ebayImage') or '').startswith('http'))
          svg = sum(1 for p in d if str(p.get('image') or '').endswith('.svg') and not str(p.get('ebayImage') or '').startswith('http'))
          print(f'  Real images: {img}')
          print(f'  SVG fallback: {svg}')
          "

      - name: Generate static category and hub pages
        run: python scripts/generate_static_catalog_pages.py

      - name: Generate static product HTML pages
        run: python scripts/generate_static_products.py

      - name: Rebuild sitemap files
        run: python scripts/rebuild_sitemaps.py

      - name: Embed robots and sitemap responses into worker
        run: python scripts/embed_static_text_routes.py

      - name: Commit and push static pages
        run: |
          git config user.name "CampMate Bot"
          git config user.email "bot@campmate.au"
          git add products/ tents.html chairs.html coolers.html stoves.html lanterns.html sleeping-bags.html categories.html popular.html sitemap.xml sitemap-main.xml sitemap-guides.xml sitemap-products.xml scripts/build_products_json.py scripts/run_catalog_cleanup.py scripts/rebuild_sitemaps.py scripts/generate_static_products.py scripts/generate_static_catalog_pages.py scripts/catalog_rules.py worker.js scripts/embed_static_text_routes.py .github/workflows/daily-ebay-import.yml

          if git diff --cached --quiet; then
            echo "No static page changes to commit"
            exit 0
          fi

          git commit -m "Rebuild static catalog pages $(date +%Y-%m-%d)"
          BRANCH="${GITHUB_REF_NAME:-main}"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
