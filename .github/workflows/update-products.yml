
name: Build Products JSON

on:
  push:
    branches: [ main ]
    paths:
      - 'data/products_source.json'
      - 'scripts/build_products_json.py'
      - '.github/workflows/update-products.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-products:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build products.json
        run: python scripts/build_products_json.py

      - name: Commit generated file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json
          git diff --cached --quiet && exit 0
          git commit -m "Auto-update products.json"
          git push
